# Perfil local: Ollama, LocalStack S3, Redis desactivado, logs DEBUG

# Evita beans OpenAI opcionales (audio/imagen) sin API key en local con Ollama
spring.ai.openai.api-key=${OPENAI_API_KEY:local-no-op}

spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2}
spring.ai.ollama.chat.options.num-ctx=${OLLAMA_NUM_CTX:8192}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBED_MODEL:nomic-embed-text}

soporte-rag.vector.embeddings-provider=spring-ollama
soporte-rag.vector.embedding-dimensions=768

# S3 → LocalStack (mismos buckets que backend-sesion1 / docker-compose)
soporte-rag.almacenamiento.s3.enabled=true
soporte-rag.almacenamiento.s3.endpoint=${SOPORTE_RAG_S3_ENDPOINT:http://127.0.0.1:4566}
soporte-rag.almacenamiento.s3.presign-endpoint=${SOPORTE_RAG_S3_PRESIGN_ENDPOINT:http://127.0.0.1:4566}
soporte-rag.almacenamiento.s3.access-key=${AWS_ACCESS_KEY_ID:test}
soporte-rag.almacenamiento.s3.secret-key=${AWS_SECRET_ACCESS_KEY:test}
soporte-rag.almacenamiento.s3.bucket-soporte=soporte
soporte-rag.almacenamiento.s3.bucket-borradores=borradores
soporte-rag.almacenamiento.s3.bucket-workarea=workarea

# Caché Redis desactivada en local
soporte-rag.cache.redis.enabled=false
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

logging.level.root=INFO
logging.level.com.bsg.soporterag=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.reactor.netty=INFO
