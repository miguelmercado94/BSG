# Perfil nube: OpenAI, Redis ElastiCache, S3 regional AWS (ECS/Fargate + IAM)

spring.autoconfigure.exclude=\
  org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=https://api.openai.com

spring.ai.model.chat=openai
spring.ai.openai.chat.base-url=https://api.openai.com
spring.ai.openai.chat.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.max-completion-tokens=8192

spring.ai.model.embedding.text=openai
spring.ai.openai.embedding.base-url=https://api.openai.com
spring.ai.openai.embedding.api-key=${OPENAI_API_KEY:}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.embedding.options.dimensions=${SOPORTE_RAG_VECTOR_EMBEDDING_DIM:768}

soporte-rag.vector.embeddings-provider=spring-ai
soporte-rag.vector.embedding-dimensions=${SOPORTE_RAG_VECTOR_EMBEDDING_DIM:768}

# S3 real: IAM del task ECS/Fargate (sin endpoint). Buckets alineados con Terraform main.tf
soporte-rag.almacenamiento.s3.endpoint=
soporte-rag.almacenamiento.s3.presign-endpoint=
soporte-rag.almacenamiento.s3.access-key=
soporte-rag.almacenamiento.s3.secret-key=
soporte-rag.almacenamiento.s3.bucket-soporte=${SOPORTE_RAG_S3_BUCKET_SOPORTE:bsg-docviz-soporte-env}
soporte-rag.almacenamiento.s3.bucket-borradores=${SOPORTE_RAG_S3_BUCKET_BORRADORES:bsg-docviz-borradores-env}
soporte-rag.almacenamiento.s3.bucket-workarea=${SOPORTE_RAG_S3_BUCKET_WORKAREA:bsg-docviz-workarea-env}

# Redis activo (ElastiCache)
soporte-rag.cache.redis.enabled=true
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:12}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}

logging.level.root=INFO
logging.level.com.bsg.soporterag=INFO
