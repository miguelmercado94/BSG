server.port=${PORT:8090}
spring.application.name=soporte-rag-mt
spring.threads.virtual.enabled=true

# Perfiles: local (Ollama, sin Redis) | nube (OpenAI, Redis, IAM S3)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.config.import=optional:file:./application-local.properties

# --- MongoDB (metadatos dominio) ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/soporte_rag_mt}

# --- PostgreSQL + pgvector ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/soporte_rag_mt}
spring.datasource.username=${DATABASE_USER:soporte_rag}
spring.datasource.password=${DATABASE_PASSWORD:soporte_rag}

# --- Vector / RAG (dos fuentes → dos tablas pgvector) ---
soporte-rag.vector.embedding-dimensions=${SOPORTE_RAG_VECTOR_EMBEDDING_DIM:768}
soporte-rag.vector.rag-top-k=${SOPORTE_RAG_RAG_TOP_K:6}
soporte-rag.vector.chunk-size=${SOPORTE_RAG_CHUNK_SIZE:800}
soporte-rag.vector.chunk-overlap=${SOPORTE_RAG_CHUNK_OVERLAP:120}
soporte-rag.vector.embeddings-provider=${SOPORTE_RAG_EMBEDDINGS_PROVIDER:spring-ollama}
# Tabla chunks indexados desde repositorio Git (namespace = vector_namespace del repo)
soporte-rag.vector.tabla-git=${SOPORTE_RAG_VECTOR_TABLA_GIT:soporte_rag_git_chunk}
# Tabla chunks indexados desde markdown/documentos de soporte en S3 (fuente soporte:clave)
soporte-rag.vector.tabla-soporte=${SOPORTE_RAG_VECTOR_TABLA_SOPORTE:soporte_rag_soporte_chunk}

# --- S3 (mismos tres buckets que backend-sesion1; cliente compartido) ---
soporte-rag.almacenamiento.s3.enabled=${SOPORTE_RAG_S3_ENABLED:true}
soporte-rag.almacenamiento.s3.region=${SOPORTE_RAG_S3_REGION:us-east-1}
soporte-rag.almacenamiento.s3.endpoint=${SOPORTE_RAG_S3_ENDPOINT:}
soporte-rag.almacenamiento.s3.presign-endpoint=${SOPORTE_RAG_S3_PRESIGN_ENDPOINT:}
soporte-rag.almacenamiento.s3.access-key=${AWS_ACCESS_KEY_ID:}
soporte-rag.almacenamiento.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
# Equivalente docviz.support.s3-bucket / Terraform bsg-docviz-soporte-env
soporte-rag.almacenamiento.s3.bucket-soporte=${SOPORTE_RAG_S3_BUCKET_SOPORTE:${DOCVIZ_SUPPORT_S3_BUCKET:soporte}}
# Equivalente docviz.workspace-s3.borrador-bucket / bsg-docviz-borradores-env
soporte-rag.almacenamiento.s3.bucket-borradores=${SOPORTE_RAG_S3_BUCKET_BORRADORES:${DOCVIZ_WORKSPACE_S3_BORRADOR_BUCKET:borradores}}
# Equivalente docviz.workspace-s3.workarea-bucket / bsg-docviz-workarea-env
soporte-rag.almacenamiento.s3.bucket-workarea=${SOPORTE_RAG_S3_BUCKET_WORKAREA:${DOCVIZ_WORKSPACE_S3_WORKAREA_BUCKET:workarea}}
soporte-rag.almacenamiento.s3.soporte-repo-prefix-template={repoSlug}/
soporte-rag.almacenamiento.s3.soporte-session-prefix-template=_session/
soporte-rag.almacenamiento.s3.borradores-prefix-template={userId}/{taskCode}/
soporte-rag.almacenamiento.s3.workarea-prefix-template={userId}/{taskCode}/
soporte-rag.almacenamiento.s3.presigned-url-ttl-seconds=${SOPORTE_RAG_S3_PRESIGN_TTL_SECONDS:3600}

# --- Redis (caché opcional; desactivado en perfil local) ---
soporte-rag.cache.redis.enabled=${SOPORTE_RAG_REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
soporte-rag.cache.redis.key-prefix=${SOPORTE_RAG_REDIS_KEY_PREFIX:soporte-rag:}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

logging.level.root=INFO
logging.level.com.bsg.soporterag=INFO
