# Docker Compose — Arquitectura completa BSG (Eureka + Gateway + Core)
# =====================================================================
# Fase 1: Eureka + infra:  docker compose up -d
# Fase 2: descomentar back-security y soporte-rag-mt cuando eureka esté healthy

services:

  # =========================================================================
  # INFRAESTRUCTURA
  # =========================================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: bsg-postgres-docviz
    environment:
      POSTGRES_USER: docviz
      POSTGRES_PASSWORD: docviz
      POSTGRES_DB: docviz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docviz -d docviz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: bsg-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bsg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  localstack:
    image: localstack/localstack:3
    container_name: bsg-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,dynamodb
      DEBUG: "0"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: bsg-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-pull-models:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      PULL_CHAT: ${OLLAMA_PULL_CHAT:-llama3.1:8b}
      PULL_EMBED: ${OLLAMA_PULL_EMBED:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        export OLLAMA_HOST=http://ollama:11434
        echo "Esperando API Ollama..."
        for i in $$(seq 1 90); do
          if ollama list >/dev/null 2>&1; then echo "Ollama listo."; break; fi
          sleep 2
        done
        echo "Descargando chat: $$PULL_CHAT"
        ollama pull "$$PULL_CHAT"
        echo "Descargando embeddings: $$PULL_EMBED"
        ollama pull "$$PULL_EMBED"
        echo "Modelos listos."
    restart: "no"

  # =========================================================================
  # EUREKA SERVER — Service Discovery
  # =========================================================================

  eureka:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    image: bsg-eureka-server:latest
    container_name: bsg-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # =========================================================================
  # API GATEWAY — Spring Cloud Gateway (puerto 8080)
  # =========================================================================

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: bsg-api-gateway:latest
    container_name: bsg-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://eureka:8761/eureka/
      SOPORTE_RAG_URI: lb://soporte-rag-mt
      GATEWAY_DISCOVERY_LOCATOR: "false"
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  # =========================================================================
  # SOPORTE-RAG-MT (Core) — puerto 8090, context-path /docviz
  # =========================================================================

  soporte-rag-mt:
    build:
      context: ./soporte-rag-mt
      dockerfile: Dockerfile
    image: bsg-soporte-rag-mt:latest
    container_name: bsg-soporte-rag-mt
    ports:
      - "8090:8080"
    env_file:
      - path: ./soporte-rag-mt/.env
        required: false
    environment:
      PORT: "8080"
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/docviz
      DATABASE_USER: docviz
      DATABASE_PASSWORD: docviz
      MONGODB_URI: mongodb://mongo:27017/soporte_rag
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SOPORTE_RAG_REDIS_ENABLED: "true"
      SOPORTE_RAG_REDIS_HISTORIAL_KEY_PREFIX: "historial-chat:"
      SOPORTE_RAG_REDIS_HISTORIAL_TTL_SECONDS: "86400"
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: llama3.1:8b
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      SOPORTE_RAG_S3_ENABLED: "true"
      SOPORTE_RAG_S3_ENDPOINT: http://localstack:4566
      SOPORTE_RAG_S3_PRESIGN_ENDPOINT: http://127.0.0.1:4566
      SOPORTE_RAG_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://eureka:8761/eureka/
      OPENAI_API_KEY: ${OPENAI_API_KEY:-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}
      SOPORTE_RAG_CHAT_MODEL_ANALIZAR: gpt-4o-mini
      SOPORTE_RAG_CHAT_MODEL_RESPONDER: gpt-4o-mini
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      ollama:
        condition: service_started
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/docviz/api/v1/infraestructura/salud"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  # =========================================================================
  # FRONTEND (opcional — profile "frontend")
  # =========================================================================

  # frontend:
