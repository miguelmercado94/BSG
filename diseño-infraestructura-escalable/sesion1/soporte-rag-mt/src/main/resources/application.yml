server:
  port: ${PORT:8080}

spring:
  application:
    name: soporte-rag-mt
  webflux:
    base-path: /docviz
  threads:
    virtual:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:file:./application-local.yml
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/soporte_rag}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rag_db}
    username: ${DATABASE_USER:rag_user}
    password: ${DATABASE_PASSWORD:rag_password}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        timeout: 600s
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
          num-predict: 1024
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    retry:
      max-attempts: 1
      on-client-errors: false

soporte-rag:
  vector:
    embedding-dimensions: ${SOPORTE_RAG_VECTOR_EMBEDDING_DIM:768}
    rag-top-k: ${SOPORTE_RAG_RAG_TOP_K:6}
    chunk-size: ${SOPORTE_RAG_CHUNK_SIZE:800}
    chunk-overlap: ${SOPORTE_RAG_CHUNK_OVERLAP:120}
    max-file-size-mb: ${SOPORTE_RAG_MAX_FILE_SIZE_MB:20}
    embedding-batch-size: ${SOPORTE_RAG_EMBEDDING_BATCH_SIZE:32}
    embeddings-provider: ${SOPORTE_RAG_EMBEDDINGS_PROVIDER:spring-ollama}
    tabla-git: ${SOPORTE_RAG_VECTOR_TABLA_GIT:soporte_rag_git_chunk}
    tabla-soporte: ${SOPORTE_RAG_VECTOR_TABLA_SOPORTE:soporte_rag_soporte_chunk}
  
  prompt:
    sistema: "Eres un asistente de soporte técnico experto y multidisciplinario (.NET, Oracle PL/SQL, Java, Python, Cloud, etc.). Tu objetivo es responder con alta precisión técnica basándote en el contexto del repositorio y enriqueciendo tus respuestas consultando en línea las herramientas y URLs de documentación técnica asociadas a los tags del repositorio (usa 'consultarPaginaWeb' para páginas de documentación oficial, manuales, sintaxis y ejemplos de código, o 'consultarDependenciasMaven' para dependencias Maven). Proporciona explicaciones claras, mejores prácticas y ejemplos de código cuando sea pertinente."
    usuario: "Usando el siguiente contexto, responde a la consulta del usuario.\n---\nContexto: {contexto}\n---\nConsulta: {pregunta}"
    analisis: >
      Eres un despachador de intenciones. Tu función es analizar la pregunta de un usuario y determinar qué se necesita para responderla.
      Dada la pregunta del usuario y una lista de herramientas disponibles, debes decidir si la pregunta es pertinente y qué recursos necesita.
      IMPORTANTE: Si el usuario incluye referencias directas a archivos usando el formato [@repo/ruta_del_archivo] o [@soporte/ruta_del_archivo], DEBES establecer 'requiereProcesamientoProfundo' y 'requiereRag' en true incondicionalmente.
      Responde únicamente con un objeto JSON que se ajuste a la estructura de 'ResultadoAnalisisIntencionDto'.
      
      Herramientas disponibles:
      {tools}
      
      Pregunta del usuario:
      {pregunta}

  chat:
    models:
      analizar: ${SOPORTE_RAG_CHAT_MODEL_ANALIZAR:llama3.1:8b}
      responder: ${SOPORTE_RAG_CHAT_MODEL_RESPONDER:llama3.1:8b}

  almacenamiento:
    s3:
      enabled: ${SOPORTE_RAG_S3_ENABLED:true}
      region: ${SOPORTE_RAG_S3_REGION:us-east-1}
      endpoint: ${SOPORTE_RAG_S3_ENDPOINT:}
      presign-endpoint: ${SOPORTE_RAG_S3_PRESIGN_ENDPOINT:}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      bucket-soporte: ${SOPORTE_RAG_S3_BUCKET_SOPORTE:${DOCVIZ_SUPPORT_S3_BUCKET:soporte}}
      bucket-borradores: ${SOPORTE_RAG_S3_BUCKET_BORRADORES:${DOCVIZ_WORKSPACE_S3_BORRADOR_BUCKET:borradores}}
      bucket-workarea: ${SOPORTE_RAG_S3_BUCKET_WORKAREA:${DOCVIZ_WORKSPACE_S3_WORKAREA_BUCKET:workarea}}
      soporte-repo-prefix-template: "{repoSlug}/"
      soporte-session-prefix-template: "_session/"
      borradores-prefix-template: "{userId}/{taskCode}/"
      workarea-prefix-template: "{userId}/{taskCode}/"
      presigned-url-ttl-seconds: ${SOPORTE_RAG_S3_PRESIGN_TTL_SECONDS:3600}
  cache:
    redis:
      enabled: ${SOPORTE_RAG_REDIS_ENABLED:false}
      key-prefix: ${SOPORTE_RAG_REDIS_KEY_PREFIX:soporte-rag:}
      historial-key-prefix: ${SOPORTE_RAG_REDIS_HISTORIAL_KEY_PREFIX:historial-chat:}
      historial-ttl-seconds: ${SOPORTE_RAG_REDIS_HISTORIAL_TTL_SECONDS:86400}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.bsg.soporterag: INFO

# =========================================================================
# Eureka Client — deshabilitado por defecto (local sin infra completa)
# Activar con: EUREKA_ENABLED=true y EUREKA_URL=http://host:8761/eureka/
# =========================================================================
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_ENABLED:false}
    fetch-registry: ${EUREKA_ENABLED:false}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
