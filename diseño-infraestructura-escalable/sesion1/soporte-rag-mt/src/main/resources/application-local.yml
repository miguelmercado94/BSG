# Configuración para el perfil 'local' — usa Ollama para chat y embeddings
spring:
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/soporte_rag}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rag_db}

soporte-rag:
  vector:
    embeddings-provider: spring-ollama
    embedding-dimensions: ${SOPORTE_RAG_VECTOR_EMBEDDING_DIM:768}
  chat:
    models:
      analizar: ${SOPORTE_RAG_CHAT_MODEL_ANALIZAR:llama3.1:8b}
      responder: ${SOPORTE_RAG_CHAT_MODEL_RESPONDER:llama3.1:8b}
  almacenamiento:
    s3:
      endpoint: ${SOPORTE_RAG_S3_ENDPOINT:http://localhost:4566}
