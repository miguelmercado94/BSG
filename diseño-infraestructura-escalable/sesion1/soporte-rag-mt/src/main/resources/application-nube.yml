spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com
      chat:
        base-url: https://api.openai.com
        api-key: ${OPENAI_API_KEY:}
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          max-completion-tokens: 8192
      embedding:
        base-url: https://api.openai.com
        api-key: ${OPENAI_API_KEY:}
        options:
          model: text-embedding-3-small
          dimensions: ${SOPORTE_RAG_VECTOR_EMBEDDING_DIM:768}
    model:
      chat: openai
      embedding:
        text: openai
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      ssl:
        enabled: ${REDIS_SSL:false}
  management:
    health:
      redis:
        enabled: false
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:12}
      minimum-idle: ${HIKARI_MIN_IDLE:2}

soporte-rag:
  vector:
    embeddings-provider: spring-ai
    embedding-dimensions: ${SOPORTE_RAG_VECTOR_EMBEDDING_DIM:768}
  
  chat:
    models:
      analizar: "gpt-3.5-turbo"
      responder: "gpt-4o"

  almacenamiento:
    s3:
      endpoint: ${SOPORTE_RAG_S3_ENDPOINT:}
      presign-endpoint: ${SOPORTE_RAG_S3_PRESIGN_ENDPOINT:}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      bucket-soporte: ${SOPORTE_RAG_S3_BUCKET_SOPORTE:soporte}
      bucket-borradores: ${SOPORTE_RAG_S3_BUCKET_BORRADORES:borradores}
      bucket-workarea: ${SOPORTE_RAG_S3_BUCKET_WORKAREA:workarea}
  cache:
    redis:
      enabled: true
      key-prefix: ${SOPORTE_RAG_REDIS_KEY_PREFIX:soporte-rag:}
      historial-key-prefix: ${SOPORTE_RAG_REDIS_HISTORIAL_KEY_PREFIX:historial-chat:}
      historial-ttl-seconds: ${SOPORTE_RAG_REDIS_HISTORIAL_TTL_SECONDS:86400}

logging:
  level:
    root: INFO
    com.bsg.soporterag: INFO
