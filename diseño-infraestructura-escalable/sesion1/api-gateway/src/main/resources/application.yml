server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 30s

      # Rutas explicitas hacia los microservicios
      routes:
        # back-security: autenticación, usuarios y estado de salud público
        - id: back-security
          uri: ${SECURITY_SERVICE_URI:http://back-security-sesion1.railway.internal:8080}
          predicates:
            - Path=/api/public/**, /api/v1/auth/**, /api/v1/customers/**, /security-auth/**
          filters:
            - RewritePath=/security-auth/auth/(?<segment>.*), /api/v1/auth/${segment}
            - RewritePath=/security-auth/users/(?<segment>.*), /api/v1/customers/${segment}
            - RewritePath=/security-auth/(?<segment>.*), /api/v1/${segment}

        # soporte-rag-mt (core): RAG, celulas, repositorios, soportes, tareas, workspace
        - id: soporte-rag-mt
          uri: ${SOPORTE_RAG_URI:http://soporte-rag-mt.railway.internal:8080}
          predicates:
            - Path=/api/v1/**, /api/rag/**, /api/chat/**, /docviz/**
          filters:
            - RewritePath=/api/rag/(?<segment>.*), /api/v1/soportes/${segment}
            - RewritePath=/api/chat/(?<segment>.*), /api/v1/soportes/chat/${segment}
            - RewritePath=/docviz/(?<segment>.*), /${segment}

      # Discovery automático desactivado (descubrimiento vía DNS privado Railway)
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true

      # CORS global
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
              - "https://*.railway.app"
              - "https://*.up.railway.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# =========================================================================
# Backend Security URI para validacion interna de tokens
# =========================================================================
bsg:
  gateway:
    security-service-uri: ${SECURITY_SERVICE_INTERNAL_URI:http://back-security-sesion1.railway.internal:8080}

# =========================================================================
# Eureka Client — Deshabilitado (usamos Railway DNS privado)
# =========================================================================
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}
