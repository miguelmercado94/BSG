server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 30s

      # Rutas explicitas hacia los microservicios con orden de prioridad
      routes:
        # soporte-rag-mt: WebSocket de chat por HU (Prioridad 0)
        - id: soporte-rag-mt-ws
          order: 0
          uri: ${SOPORTE_RAG_WS_URI:ws://soporte-rag-mt.railway.internal:8080}
          predicates:
            - Path=/ws/**
          filters:
            - PrefixPath=/docviz

        # soporte-rag-mt: WebSocket directo prefijado con /docviz/ws/** (Prioridad 0)
        - id: soporte-rag-mt-ws-docviz
          order: 0
          uri: ${SOPORTE_RAG_WS_URI:ws://soporte-rag-mt.railway.internal:8080}
          predicates:
            - Path=/docviz/ws/**

        # back-security: peticiones que ya vienen con /security-auth/** (Prioridad 1)
        - id: back-security-direct
          order: 1
          uri: ${SECURITY_SERVICE_URI:http://back-security-sesion1.railway.internal:8080}
          predicates:
            - Path=/security-auth/**

        # back-security: autenticación, usuarios y salud pública desde el frontend (Prioridad 2)
        - id: back-security-api
          order: 2
          uri: ${SECURITY_SERVICE_URI:http://back-security-sesion1.railway.internal:8080}
          predicates:
            - Path=/api/public/**, /api/v1/auth/**, /api/v1/customers/**
          filters:
            - PrefixPath=/security-auth

        # soporte-rag-mt: peticiones ya prefijadas con /docviz/** (Prioridad 2)
        - id: soporte-rag-mt-docviz
          order: 2
          uri: ${SOPORTE_RAG_URI:http://soporte-rag-mt.railway.internal:8080}
          predicates:
            - Path=/docviz/**

        # soporte-rag-mt: atajos de compatibilidad /api/rag/** y /api/chat/** (Prioridad 3)
        - id: soporte-rag-mt-shortcuts
          order: 3
          uri: ${SOPORTE_RAG_URI:http://soporte-rag-mt.railway.internal:8080}
          predicates:
            - Path=/api/rag/**, /api/chat/**
          filters:
            - RewritePath=/api/rag/(?<segment>.*), /docviz/api/v1/soportes/${segment}
            - RewritePath=/api/chat/(?<segment>.*), /docviz/api/v1/soportes/chat/${segment}

        # soporte-rag-mt (core): resto de /api/v1/** (celulas, repos, soportes, tareas, workspace) (Prioridad 10)
        - id: soporte-rag-mt-api
          order: 10
          uri: ${SOPORTE_RAG_URI:http://soporte-rag-mt.railway.internal:8080}
          predicates:
            - Path=/api/v1/**
          filters:
            - PrefixPath=/docviz

      # Discovery automático desactivado (descubrimiento vía DNS privado Railway)
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true

      # CORS global
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# =========================================================================
# Backend Security URI para validacion interna de tokens
# =========================================================================
bsg:
  gateway:
    security-service-uri: ${SECURITY_SERVICE_INTERNAL_URI:http://back-security-sesion1.railway.internal:8080}

# =========================================================================
# Eureka Client — Deshabilitado (usamos Railway DNS privado)
# =========================================================================
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}
